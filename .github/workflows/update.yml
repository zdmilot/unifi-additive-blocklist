name: Update blocklist
on:
  workflow_dispatch:
  schedule:
    - cron: '19 7 * * *'
permissions:
  contents: write
concurrency:
  group: blocklist-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - name: Update while retaining every prior domain
        run: |
          python3 update.py --check
          cp blocklist.txt "$RUNNER_TEMP/previous-blocklist.txt"
          python3 update.py --write
          python3 update.py --check --baseline "$RUNNER_TEMP/previous-blocklist.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: unifi-additive-blocklist
          path: |
            blocklist.txt
            build-report.json
            SOURCES.md
            LICENSE
      - name: Commit updated history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blocklist.txt build-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update additive blocklist (retain all prior domains)'
            git push origin HEAD:main
          fi
